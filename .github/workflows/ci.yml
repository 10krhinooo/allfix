# Parked until there is a deployment to gate.
#
# The checks this file used to run now run on the machine that makes the change,
# from .githooks (pre-commit, commit-msg, pre-push), so nothing is lost by it
# being empty. It only runs when started by hand, which keeps the workflow valid
# and visible in the Actions tab. When a deployment method is chosen, the jobs
# come back here alongside it; the last full version is in git history.
name: CI

on:
  workflow_dispatch:

jobs:
  parked:
    name: Parked
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI is parked. The checks run from .githooks on each machine."
